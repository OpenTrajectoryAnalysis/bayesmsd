[build-system]
requires = ["setuptools", "wheel", "numpy>=2"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesmsd"
version = "0.2.0"
authors = [
  { name="Simon Grosse-Holz", email="s.grosse.holz@alum.mit.edu" }
]
description = "Bayesian MSD fitting"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "noctiluca >=0",
    "rouse >=0",
    "numpy >=2",
    "scipy >=1.7",
    "tqdm >=4",
    "matplotlib >=3.4",
]

[project.urls]
"Homepage" = "https://github.com/OpenTrajectoryAnalysis/bayesmsd"
"Documentation" = "https://bayesmsd.readthedocs.org/en/latest"
"Bug Tracker" = "https://github.com/OpenTrajectoryAnalysis/bayesmsd/issues"
